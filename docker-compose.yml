services:
  app:
    build: .
    ports:
      - "8010:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - verification_documents:/var/www/html/storage/verification-documents
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=pharmacy
      - DB_USER=root
      - DB_PASS=medvault
      - APP_URL=http://localhost:8010
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-MedVault}
    command: >
      sh -c "
        chown -R www-data:www-data /var/www/html/storage/verification-documents &&
        apache2-foreground
      "

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: medvault
      MYSQL_DATABASE: pharmacy
    volumes:
      - mysql_data:/var/lib/mysql
      - ./pharmacy.sql:/docker-entrypoint-initdb.d/pharmacy.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: medvault
    depends_on:
      - db

volumes:
  mysql_data:
  verification_documents:
